<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Kelola Produk & Stok Akun</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <!-- Login Section -->
  <div id="login-section" class="min-h-screen flex items-center justify-center p-4">
    <form id="login-form" class="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-sm w-full space-y-4">
      <h1 class="text-xl font-bold text-center">Login Admin Toko</h1>
      <div>
        <label class="block text-xs text-slate-400 mb-1">Email Admin</label>
        <input type="email" id="admin-email" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">Password</label>
        <input type="password" id="admin-password" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
      </div>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-2.5 rounded-lg text-sm font-semibold">Masuk</button>
    </form>
  </div>

  <!-- Dashboard Section -->
  <div id="dashboard-section" class="hidden max-w-5xl mx-auto px-4 py-8 space-y-8">
    <div class="flex justify-between items-center border-b border-slate-800 pb-4">
      <h1 class="text-xl font-bold text-indigo-400">Dashboard Admin</h1>
      <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg">Keluar</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Form 1: Tambah Produk + Peraturan -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
        <h2 class="font-bold text-lg mb-4">1. Tambah Produk Baru</h2>
        <form id="product-form" class="space-y-3">
          <input type="text" id="prod-name" required placeholder="Nama Produk (misal: CapCut Pro 1 Bulan)"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
          <input type="number" id="prod-price" required placeholder="Harga (misal: 25000)"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
          <input type="text" id="prod-desc" placeholder="Deskripsi singkat (opsional)"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
          <textarea id="prod-rules" rows="4" required placeholder="Peraturan & Larangan (misal: Dilarang ganti password, maksimal 1 device, garansi aktif 30 hari)"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm"></textarea>
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-2 rounded-lg text-sm font-semibold">
            Simpan Produk
          </button>
        </form>
      </div>

      <!-- Form 2: Tambah Stok Akun (Username & Password) -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
        <h2 class="font-bold text-lg mb-4">2. Tambah Stok Akun</h2>
        <form id="stock-form" class="space-y-3">
          <select id="stock-product-select" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm">
            <option value="">-- Pilih Produk --</option>
          </select>
          <p class="text-xs text-slate-400">Masukkan 1 akun per baris dengan format: <code class="text-indigo-300">email_atau_username|password</code></p>
          <textarea id="stock-lines" rows="6" required placeholder="akun1@gmail.com|pass12345&#10;akun2@gmail.com|rahasia99"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm font-mono"></textarea>
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2 rounded-lg text-sm font-semibold">
            Upload Stok Akun
          </button>
        </form>
      </div>
    </div>

    <!-- Tabel Status Stok & Transaksi -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
      <h2 class="font-bold text-lg mb-4">3. Transaksi Terakhir</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="text-slate-400 border-b border-slate-800">
            <tr>
              <th class="py-2">Invoice</th>
              <th class="py-2">Pembeli</th>
              <th class="py-2">WhatsApp</th>
              <th class="py-2">Total</th>
              <th class="py-2">Status</th>
            </tr>
          </thead>
          <tbody id="orders-tbody" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        loadAdminData();
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { error } = await supabaseClient.auth.signInWithPassword({
        email: document.getElementById('admin-email').value,
        password: document.getElementById('admin-password').value
      });
      if (error) return alert('Login gagal: ' + error.message);
      checkAuth();
    });

    async function logout() {
      await supabaseClient.auth.signOut();
      location.reload();
    }

    async function loadAdminData() {
      const { data: products } = await supabaseClient.from('products_with_stock').select('*');
      const select = document.getElementById('stock-product-select');
      select.innerHTML = '<option value="">-- Pilih Produk --</option>' +
        (products || []).map(p => `<option value="${p.id}">${p.name} (Sisa Stok: ${p.available_stock})</option>`).join('');

      const { data: orders } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false }).limit(20);
      document.getElementById('orders-tbody').innerHTML = (orders || []).map(o => `
        <tr>
          <td class="py-2 font-mono text-xs">${o.invoice_code}</td>
          <td class="py-2">${o.customer_name}</td>
          <td class="py-2">${o.customer_wa}</td>
          <td class="py-2">Rp ${o.amount.toLocaleString('id-ID')}</td>
          <td class="py-2">
            <span class="px-2 py-0.5 rounded text-xs ${o.status === 'PAID' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-300'}">
              ${o.status}
            </span>
          </td>
        </tr>
      `).join('');
    }

    document.getElementById('product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { error } = await supabaseClient.from('products').insert({
        name: document.getElementById('prod-name').value.trim(),
        price: parseInt(document.getElementById('prod-price').value, 10),
        description: document.getElementById('prod-desc').value.trim(),
        rules: document.getElementById('prod-rules').value.trim()
      });
      if (error) return alert('Error: ' + error.message);
      alert('Produk berhasil ditambahkan!');
      e.target.reset();
      loadAdminData();
    });

    document.getElementById('stock-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const productId = document.getElementById('stock-product-select').value;
      const lines = document.getElementById('stock-lines').value.trim().split('\n').filter(Boolean);
      const rows = lines.map(line => {
        const [account_username, account_password] = line.split('|').map(s => s.trim());
        return { product_id: productId, account_username, account_password };
      }).filter(r => r.account_username && r.account_password);

      if (!rows.length) return alert('Format stok tidak valid. Gunakan username|password');

      const { error } = await supabaseClient.from('account_stocks').insert(rows);
      if (error) return alert('Gagal upload stok: ' + error.message);
      alert(`${rows.length} stok akun berhasil ditambahkan!`);
      e.target.reset();
      loadAdminData();
    });

    checkAuth();
  </script>
</body>
</html>
