<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toko Akun Premium Otomatis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-10 backdrop-blur">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold text-indigo-400">DigitalStore</h1>
      <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full">
        Proses Otomatis 24/7 via WhatsApp
      </span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <div class="mb-8">
      <h2 class="text-2xl font-bold mb-1">Pilih Produk Digital</h2>
      <p class="text-slate-400 text-sm">Akun, password, dan panduan penggunaan langsung dikirim ke WhatsApp setelah pembayaran berhasil.</p>
    </div>

    <div id="product-list" class="grid grid-cols-1 md:grid-cols-3 gap-5">
      <p class="text-slate-400">Memuat katalog produk...</p>
    </div>
  </main>

  <!-- Modal Checkout -->
  <div id="checkout-modal" class="fixed inset-0 bg-black/75 hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6">
      <div class="flex justify-between items-start mb-4">
        <div>
          <h3 id="modal-title" class="text-lg font-bold">Nama Produk</h3>
          <p id="modal-price" class="text-indigo-400 font-semibold text-sm">Rp 0</p>
        </div>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xl">&times;</button>
      </div>

      <!-- Box Peraturan & Larangan -->
      <div class="bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 mb-4 text-xs text-amber-200">
        <p class="font-semibold mb-1">Peraturan & Larangan Penggunaan:</p>
        <p id="modal-rules" class="whitespace-pre-line leading-relaxed"></p>
      </div>

      <form id="checkout-form" class="space-y-4">
        <input type="hidden" id="selected-product-id" />
        <div>
          <label class="block text-xs text-slate-400 mb-1">Nama Pembeli</label>
          <input type="text" id="customer-name" required placeholder="Contoh: Budi Santoso"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Nomor WhatsApp Aktif (Tujuan Kirim Akun)</label>
          <input type="tel" id="customer-wa" required placeholder="Contoh: 081234567890"
            class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" />
        </div>
        <label class="flex items-start gap-2 text-xs text-slate-300 cursor-pointer">
          <input type="checkbox" id="agree-rules" required class="mt-0.5 rounded bg-slate-800 border-slate-700" />
          <span>Saya sudah membaca dan setuju mematuhi peraturan & larangan akun di atas.</span>
        </label>
        <button type="submit" id="btn-pay"
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg text-sm transition">
          Lanjut ke Pembayaran Otomatis
        </button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    const formatRupiah = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);

    function normalizeWA(phone) {
      let clean = phone.replace(/\D/g, '');
      if (clean.startsWith('0')) clean = '62' + clean.slice(1);
      return clean;
    }

    async function loadProducts() {
      const { data, error } = await supabaseClient.from('products_with_stock').select('*');
      const container = document.getElementById('product-list');

      if (error) {
        container.innerHTML = `<p class="text-rose-400">Gagal memuat produk: ${error.message}</p>`;
        return;
      }
      if (!data.length) {
        container.innerHTML = `<p class="text-slate-400">Belum ada produk tersedia.</p>`;
        return;
      }

      container.innerHTML = data.map(p => `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-start gap-2 mb-2">
              <h3 class="font-bold text-lg">${p.name}</h3>
              <span class="text-xs px-2.5 py-1 rounded-full ${p.available_stock > 0 ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}">
                ${p.available_stock > 0 ? `Stok: ${p.available_stock}` : 'Habis'}
              </span>
            </div>
            <p class="text-slate-400 text-sm mb-4">${p.description || ''}</p>
          </div>
          <div>
            <p class="text-xl font-bold text-indigo-400 mb-3">${formatRupiah(p.price)}</p>
            <button onclick='openModal(${JSON.stringify(p).replace(/'/g, "&#39;")})'
              ${p.available_stock <= 0 ? 'disabled' : ''}
              class="w-full py-2.5 rounded-lg text-sm font-semibold transition ${p.available_stock > 0 ? 'bg-indigo-600 hover:bg-indigo-500 text-white' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}">
              ${p.available_stock > 0 ? 'Beli Sekarang' : 'Stok Habis'}
            </button>
          </div>
        </div>
      `).join('');
    }

    function openModal(product) {
      document.getElementById('selected-product-id').value = product.id;
      document.getElementById('modal-title').textContent = product.name;
      document.getElementById('modal-price').textContent = formatRupiah(product.price);
      document.getElementById('modal-rules').textContent = product.rules;
      document.getElementById('checkout-modal').classList.remove('hidden');
      document.getElementById('checkout-modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('checkout-modal').classList.add('hidden');
      document.getElementById('checkout-modal').classList.remove('flex');
    }

    document.getElementById('checkout-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-pay');
      btn.disabled = true;
      btn.textContent = 'Membuat tagihan...';

      const payload = {
        product_id: document.getElementById('selected-product-id').value,
        customer_name: document.getElementById('customer-name').value.trim(),
        customer_wa: normalizeWA(document.getElementById('customer-wa').value)
      };

      const { data, error } = await supabaseClient.functions.invoke('create-order', { body: payload });

      if (error || !data?.payment_url) {
        alert('Gagal membuat transaksi: ' + (error?.message || data?.error || 'Coba lagi'));
        btn.disabled = false;
        btn.textContent = 'Lanjut ke Pembayaran Otomatis';
        return;
      }

      window.location.href = data.payment_url;
    });

    loadProducts();
  </script>
</body>
</html>
